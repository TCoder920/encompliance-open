services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set a local-only database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - local_db:/var/lib/postgresql/data
volumes:
  local_db:
