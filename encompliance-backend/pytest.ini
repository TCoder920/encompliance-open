# pytest.ini - Pytest configuration file for EnCompliance
#
# Description: This file configures pytest for the EnCompliance backend project.
# Purpose: Sets test discovery paths, coverage requirements, and warning filters to ensure consistent and reliable test execution.
[pytest]
addopts = --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=90
testpaths = tests
asyncio_mode = strict
filterwarnings =
    ignore::DeprecationWarning:passlib.utils
    ignore::DeprecationWarning:PyPDF2
    ignore::sqlalchemy.exc.MovedIn20Warning
    ignore::DeprecationWarning:pytest_asyncio.plugin
    ignore::DeprecationWarning:pydantic 